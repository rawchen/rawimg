server:
  port: 8888

spring:
  # Database Configuration (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rawimg?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  # Mail Configuration
  mail:
    host: smtp.qq.com
    port: 587
    username: xxx@qq.com
    password: xxx
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          starttls:
            enable: true

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    database: 5
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lenslog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT Configuration
jwt:
  secret: 12345678901234567890123456789012
  expiration: 2592000000

# Application Configuration
app:
  captcha:
    enabled: true
  upload:
    path: ./uploads
  oss:
    enabled: false
  email:
    verification:
      expire: 300  # 邮箱验证码过期时间（秒），默认5分钟

# IP Database Path
ip2region:
  xdb: file:./data/ip2region_v4.xdb

# GPT Image API Configuration
gpt:
  image:
    api-url: https://api.openai-hub.com
    api-key: sk-xxx
    model: gpt-image-2

# Aliyun OSS Configuration
aliyun:
  oss:
    access-key-id: xxx
    access-key-secret: xxx
    role-arn: acs:ram::xxx:role/xxx
    endpoint: oss-cn-xxx.aliyuncs.com
    bucket-name: xxx
    custom-domain:
    sts-expiration: 3600
    upload-folder: rawimg

# Logging
logging:
  level:
    com.lenslog: INFO
    org.springframework.security: INFO
    com.baomidou.mybatisplus: DEBUG
