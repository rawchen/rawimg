<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#orangeGradient)"/>
  <g fill="white" transform="translate(5, 7)">
    <!-- Camera body -->
    <rect x="0" y="4" width="22" height="14" rx="2"/>
    <!-- Camera lens (hollow) -->
    <circle cx="11" cy="11" r="4" fill="#f59e0b"/>
    <!-- Flash -->
    <rect x="17" y="6" width="3" height="2" rx="0.5"/>
    <!-- Viewfinder hump -->
    <path d="M7 4 L8 1 L14 1 L15 4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
